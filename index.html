<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comma Rule-ette</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Vibrant but accessible palette */
            --ink: #1a1a2e;
            --paper: #fefdfb;
            --white: #ffffff;
            
            /* Wheel colors - all tested for contrast */
            --ruby: #be123c;        /* Rose/red */
            --amber: #b45309;       /* Orange/amber */
            --emerald: #047857;     /* Green */
            --sapphire: #1d4ed8;    /* Blue */
            --violet: #7c3aed;      /* Purple */
            
            /* UI colors */
            --accent: #1d4ed8;
            --accent-dark: #1e40af;
            --accent-light: #dbeafe;
            
            --success: #047857;
            --success-bg: #d1fae5;
            --error: #be123c;
            --error-bg: #ffe4e6;
            --partial: #b45309;
            --partial-bg: #fef3c7;
            
            --muted: #525252;
            --border: #a1a1aa;
            --focus-ring: #1d4ed8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: var(--accent);
            color: white;
            padding: 0.5rem 1rem;
            z-index: 100;
            font-size: 1rem;
            text-decoration: none;
        }

        .skip-link:focus {
            top: 0;
            outline: 3px solid var(--ink);
            outline-offset: 2px;
        }

        body {
            font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #fefdfb 0%, #f0f9ff 50%, #fdf4ff 100%);
            color: var(--ink);
            line-height: 1.6;
            min-height: 100vh;
            padding: 1.5rem 1rem;
            font-size: 1rem;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-family: 'Libre Baskerville', Georgia, serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            background: linear-gradient(135deg, var(--ruby) 0%, var(--violet) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--muted);
            font-size: 1.125rem;
        }

        /* Score display */
        .score-bar {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            background: var(--white);
            border-radius: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: inline-flex;
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            font-size: 1rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .score-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        /* Wheel container */
        .wheel-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 2rem 0;
        }

        .wheel-container {
            position: relative;
            width: 340px;
